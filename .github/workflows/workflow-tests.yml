name: Workflow tooling tests
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  tests:
    name: git-policy / tooling-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sh tests/workflow/run.sh
      - run: python3 tools/workflow/generate.py --check
      - run: python3 tests/workflow/test_event.py
      - run: python3 tests/workflow/test_generation.py
      - run: python3 tests/workflow/test_status.py
